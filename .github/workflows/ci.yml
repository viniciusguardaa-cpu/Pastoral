name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Swift toolchain
        run: bash Scripts/ci-swift-toolchain.sh 6.2

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      - name: Build helper package
        run: ./Scripts/build-pkg.sh

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: pastoral-helper-pkg
          path: dist/pastoral-helper.pkg

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Swift toolchain
        run: bash Scripts/ci-swift-toolchain.sh 6.2

      - name: Build universal release
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Build DMG
        run: make dmg
        env:
          SIGN_IDENTITY: '-'

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pastoral-*.dmg
          draft: true
